name: SDK Node

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Test
        run: |
          set -o pipefail
          npm test | tee test-out.txt
      - run: npm run build
      - run: node --input-type=commonjs -e "const sdk=require('./dist/cjs/index.js'); if(!sdk.Signingflow) process.exit(1)"
      - name: Save coverage percent
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node == 22
        run: |
          node -e 'const fs=require("fs"); const text=fs.readFileSync("test-out.txt","utf8").replace(/\u001b\[[0-9;]*m/g,""); const match=text.match(/all files\s+\|\s+([0-9.]+)/); if(!match){ console.error("coverage summary was not found"); process.exit(1) } fs.writeFileSync(".coverage-percent", match[1])'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node == 22
        with:
          name: coverage-percent
          path: .coverage-percent
          retention-days: 1

  badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-percent
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/publish-coverage-badge.sh "$(cat .coverage-percent)"
